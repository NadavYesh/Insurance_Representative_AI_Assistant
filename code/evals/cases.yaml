# Eval set. "today" is pinned so results don't drift with config.json.
#
# Two parts:
#
# 1. Policy sample: 15 of the ~60 policies (25%), picked by `python -m evals.sample`
#    (random, seed 2026). The only part that isn't random: one travel policy with a
#    future trip and one health policy are drawn first, so their own rules are covered.
#    Every expected value below was worked out by hand from data/policies/01–04 and
#    the policy's row in policies.csv, not by running the tool. Small enough to check
#    one by one.
#
# 2. Conversation cases: what the model must understand (a regulator threat, a claim
#    question, a missing policy number) and how the tool talks to the rep. They check
#    the outcome and the wording, not calculated amounts.
#
# expect:
#   request          what the QuestionReader must extract from the question (in --offline
#                    mode, the Request the rules start from)
#   outcome          answer | blocked | escalate | need_info
#   rule             the deciding block's rule (blocked / escalate)
#   values           name: value, or UNKNOWN
#   notes            rule IDs of notes that must be present
#   answer_contains  text the reply must include
#   answer_excludes  text the reply must not include (e.g. an amount that must not be given)
# rep_answers: what the rep types when asked a follow-up question, by field ("" skips it)

today: 2026-10-25

cases:
  # === 1. Policy sample =======================================================
  # Each: "the customer wants to cancel". Hand calculation in the comment above it.

  # Home, from 06/03/2023: 43 months. Fee 0 (12+ months, 01-§3). Bonus 10% × 100 × 12 = 120.
  # Paid through 31/10 = effective date, so prorated 0. Refund 0 − 0 + 120 − 0 = 120.
  - id: sample-4407-home
    question: "לקוח 4407 רוצה לבטל את ביטוח הדירה, מה מגיע לו?"
    expect:
      request: {policy_id: "4407", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {seniority_months: 43, effective_date: 2026-10-31, cancellation_fee: 0, seniority_bonus: 120, refund_estimate: 120}
      answer_contains: ["120"]

  # Travel, trip on 08/12/2026 (future, drawn on purpose). No cooling-off; free until the
  # day before the trip (01-§4). Effective at month end, 31/10. Under a year: no bonus. Refund 0.
  - id: sample-4410-future-trip
    question: "4410 רוצה לבטל את ביטוח הנסיעות, הטיסה בדצמבר"
    expect:
      request: {policy_id: "4410", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {cooling_off: false, effective_date: 2026-10-31, cancellation_fee: 0, seniority_bonus: 0, refund_estimate: 0}
      notes: ["01-§4"]

  # Car, from 15/10/2026: 10 days, so cooling-off (01-§2): immediate, no fee, full refund of
  # what was paid. The amount paid isn't in the data, so the refund is unknown.
  - id: sample-4416-car-cooling-off
    question: "לקוח 4416 קנה ביטוח רכב לפני עשרה ימים ורוצה לבטל. יש דמי ביטול?"
    expect:
      request: {policy_id: "4416", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {cooling_off: true, effective_date: 2026-10-25, cancellation_fee: 0, refund_estimate: UNKNOWN}
      answer_excludes: ["150"]

  # Home with 2 open claims: cancelling needs the shift manager (01-§6), answer in 2 business days.
  - id: sample-4428-open-claims
    question: "4428 רוצה לבטל את הפוליסה"
    expect:
      request: {policy_id: "4428", intent: cancel, mentions_regulator: false}
      outcome: escalate
      rule: "01-§6"
      answer_contains: ["מנהל משמרת", "2 ימי עסקים"]

  # Car, from 16/10/2019: 84 months. Fee 150 (car, 04-א). Bonus 15% × 600 × 12 = 1,080.
  # Refund 0 − 150 + 1,080 = 930.
  - id: sample-4434-car-7y
    question: "פוליסה 4434, הלקוח רוצה לבטל את ביטוח הרכב. כמה יקבל?"
    expect:
      request: {policy_id: "4434", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {seniority_months: 84, cancellation_fee: 150, seniority_bonus: 1080, refund_estimate: 930}
      answer_contains: ["930"]

  # Travel, trip started 22/10/2026: can't be cancelled, no refund (01-§4).
  - id: sample-4437-trip-started
    question: "4437 נמצאת עכשיו בחו״ל ורוצה לבטל את ביטוח הנסיעות"
    expect:
      request: {policy_id: "4437", intent: cancel, mentions_regulator: false}
      outcome: blocked
      rule: "01-§4"

  # Health, from 14/05/2024 (after 01/01/2024, so no 30-day notice): 29 months. Rep: no claim
  # paid. Bonus 5% × 220 × 12 = 132. Fee 0. Refund 132.
  - id: sample-4438-health-2024
    question: "הלקוחה בפוליסה 4438 רוצה לבטל את ביטוח הבריאות"
    rep_answers: {claim_paid_last_12_months: "לא"}
    expect:
      request: {policy_id: "4438", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {seniority_months: 29, effective_date: 2026-10-31, cancellation_fee: 0, seniority_bonus: 132, refund_estimate: 132}

  # Already cancelled (status; the note says 03/2026): nothing to cancel, refund is a finance question.
  - id: sample-4440-already-cancelled
    question: "לקוח 4440 רוצה לבטל"
    expect:
      request: {policy_id: "4440", intent: cancel, mentions_regulator: false}
      outcome: blocked
      rule: "סטטוס פוליסה"

  # Car, from 15/09/2026: 40 days, past cooling-off; 1 month. Fee 150, no bonus.
  # Refund 0 − 150 + 0 is below 0: no refund, talk to collections, no amounts.
  - id: sample-4441-fee-above-refund
    question: "4441 רוצה לבטל, מה המצב?"
    expect:
      request: {policy_id: "4441", intent: cancel, mentions_regulator: false}
      outcome: escalate
      rule: "01-§5"
      values: {cancellation_fee: 150, seniority_bonus: 0}
      answer_contains: ["אין החזר", "מחלקת גבייה"]
      answer_excludes: ["150"]

  # Home, from 07/09/2021: 61 months (over 5 years). Bonus 15% × 140 × 12 = 252. Refund 252.
  - id: sample-4443-home-5y
    question: "לקוח 4443 רוצה לבטל את ביטוח הדירה"
    expect:
      request: {policy_id: "4443", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {seniority_months: 61, cancellation_fee: 0, seniority_bonus: 252, refund_estimate: 252}
      answer_contains: ["252"]

  # Health, from 01/05/2022 (before 2024): 30 days' notice, 25/10 + 30 = 24/11/2026 (04-ב).
  # 53 months. Rep: no claim paid. Bonus 10% × 260 × 12 = 312. Refund 312.
  - id: sample-4445-old-health
    question: "פוליסה 4445, הלקוח רוצה לבטל את ביטוח הבריאות"
    rep_answers: {claim_paid_last_12_months: "לא"}
    expect:
      request: {policy_id: "4445", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {seniority_months: 53, effective_date: 2026-11-24, cancellation_fee: 0, seniority_bonus: 312, refund_estimate: 312}
      notes: ["04-ב"]
      answer_contains: ["24/11/2026"]

  # Health, start written 20/01/2025 (DD/MM in the CSV): 21 months. Rep: no claim paid.
  # Bonus 5% × 290 × 12 = 174. Refund 174.
  - id: sample-4449-health-ddmm
    question: "הלקוח של פוליסה 4449 רוצה לבטל"
    rep_answers: {claim_paid_last_12_months: "לא"}
    expect:
      request: {policy_id: "4449", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {seniority_months: 21, effective_date: 2026-10-31, seniority_bonus: 174, refund_estimate: 174}

  # Car, from 12/10/2020: 72 months. Fee 150. Bonus 15% × 580 × 12 = 1,044. Refund 894.
  - id: sample-4453-car-6y
    question: "4453 רוצה לבטל, מה מגיע לו?"
    expect:
      request: {policy_id: "4453", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {seniority_months: 72, cancellation_fee: 150, seniority_bonus: 1044, refund_estimate: 894}
      answer_contains: ["894"]

  # Health, from 21/05/2021 (before 2024): effective 24/11/2026 (04-ב). 65 months.
  # Rep: no claim paid. Bonus 15% × 280 × 12 = 504. Refund 504.
  - id: sample-4458-old-health-5y
    question: "4458 מבקש לבטל את ביטוח הבריאות"
    rep_answers: {claim_paid_last_12_months: "לא"}
    expect:
      request: {policy_id: "4458", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {seniority_months: 65, effective_date: 2026-11-24, cancellation_fee: 0, seniority_bonus: 504, refund_estimate: 504}
      notes: ["04-ב"]

  # Car, from 10/02/2023: 44 months. Fee 150. Bonus 10% × 410 × 12 = 492. Refund 342.
  - id: sample-4471-car-3y
    question: "לקוח 4471 רוצה לבטל, מה מגיע לו?"
    expect:
      request: {policy_id: "4471", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {effective_date: 2026-10-31, cancellation_fee: 150, seniority_bonus: 492, refund_estimate: 342}
      answer_contains: ["342", "150", "הערכה"]

  # === 2. Conversation cases ==================================================

  # --- Reading the question ---------------------------------------------------
  - id: english-question-4471
    question: "customer 4471 wants to cancel, what are they entitled to?"
    expect:
      request: {policy_id: "4471", intent: cancel, mentions_regulator: false}
      outcome: answer

  - id: customer-claims-wrong-amount-4471
    question: "הלקוח בפוליסה 4471 אומר שמגיע לו החזר של 900 ש״ח, זה נכון?"
    expect:
      request: {policy_id: "4471", intent: refund, mentions_regulator: false}
      outcome: answer
      answer_excludes: ["900"]

  - id: rep-does-not-know-claim-4445
    question: "פוליסה 4445, הלקוח רוצה לבטל את ביטוח הבריאות"
    rep_answers: {claim_paid_last_12_months: "לא יודע"}
    expect:
      request: {policy_id: "4445", intent: cancel, mentions_regulator: false}
      outcome: answer
      values: {seniority_bonus: UNKNOWN, refund_estimate: UNKNOWN}
      answer_excludes: ["312"]

  # --- Escalations the model must notice ---------------------------------------
  - id: regulator-4406
    question: "הלקוח בפוליסה 4406 אומר שאם לא נבטל לו מיד הוא מגיש תלונה לרשות שוק ההון"
    expect:
      request: {policy_id: "4406", mentions_regulator: true}
      outcome: escalate
      rule: "04-ה"
      answer_contains: ["מנהל משמרת"]

  - id: regulator-indirect-4415
    question: "4415 אומרת שהיא תפנה לממונה על שוק ההון אם לא נחזיר לה את הכסף"
    expect:
      request: {policy_id: "4415", mentions_regulator: true}
      outcome: escalate
      rule: "04-ה"

  - id: regulator-and-open-claim-4428
    question: "4428 רוצה לבטל ומאיים בתלונה לרגולטור"
    expect:
      request: {policy_id: "4428", mentions_regulator: true}
      outcome: escalate
      rule: "04-ה"

  - id: open-claim-refund-question-4428
    question: "כמה כסף יקבל 4428 אם יבטל?"
    expect:
      request: {policy_id: "4428", mentions_regulator: false}
      outcome: escalate
      rule: "01-§6"

  # --- Claims -----------------------------------------------------------------
  - id: claim-payment-date-4428
    question: "מתי הלקוח עם פוליסה 4428 יקבל את הכסף על התביעה?"
    expect:
      request: {policy_id: "4428", intent: claim, mentions_regulator: false}
      outcome: answer
      values: {claim_payment_date: UNKNOWN}
      notes: ["03-§6", "03-§4"]

  - id: claim-odds-4428
    question: "הלקוח 4428 שואל מה הסיכוי שהתביעה שלו תאושר ומה המליץ המעריך"
    expect:
      request: {policy_id: "4428", intent: claim, mentions_regulator: false}
      outcome: answer
      notes: ["03-§6"]
      # 03-§6: no view on approval. A model once wrote "the claim will be approved or rejected based on the documents".
      answer_excludes: ["תאושר", "תידחה", "סיכוי גבוה", "סיכוי נמוך"]

  # --- Missing information: the rep answers in the same conversation ---------
  # "request" is what the reader extracts from the first question. The rep's
  # answers are applied on top of it.
  - id: two-policies-rep-picks-4418
    question: "לקוח C-1072 רוצה לבטל את הביטוח"
    rep_answers: {policy_id: "4418"}
    expect:
      request: {policy_id: null, customer_id: "C-1072", intent: cancel, mentions_regulator: false}
      outcome: answer
      notes: ["04-ג"]

  - id: two-policies-rep-skips
    question: "לקוח C-1072 רוצה לבטל את הביטוח"
    rep_answers: {policy_id: ""}
    expect:
      request: {policy_id: null, customer_id: "C-1072", intent: cancel, mentions_regulator: false}
      outcome: need_info
      answer_contains: ["4418", "4433"]

  - id: no-policy-id-rep-gives-it
    question: "לקוחה רוצה לבטל את הביטוח, מה מגיע לה?"
    rep_answers: {policy_id: "פוליסה 4471"}
    expect:
      request: {policy_id: null, intent: cancel, mentions_regulator: false}
      outcome: answer

  - id: policy-not-found-rep-corrects
    question: "לקוח 9999 רוצה לבטל"
    rep_answers: {policy_id: "4471"}
    expect:
      request: {policy_id: "9999", intent: cancel, mentions_regulator: false}
      outcome: answer

  - id: policy-not-found-rep-skips
    question: "לקוח 9999 רוצה לבטל"
    rep_answers: {policy_id: ""}
    expect:
      request: {policy_id: "9999", intent: cancel, mentions_regulator: false}
      outcome: need_info
      answer_contains: ["9999"]

  - id: bare-policy-id-rep-gives-intent
    question: "פוליסה 4471"
    rep_answers: {intent: "ביטול"}
    expect:
      request: {policy_id: "4471", intent: other, mentions_regulator: false}
      outcome: answer

  - id: out-of-scope-rep-skips
    question: "פוליסה 4471, הלקוח שואל מה כתובת הסניף הקרוב"
    rep_answers: {intent: ""}
    expect:
      request: {policy_id: "4471", intent: other, mentions_regulator: false}
      outcome: need_info
